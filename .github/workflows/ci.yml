name: CI

on:
  push:
    # `staging` is an opt-in convention, not required — push/merge to it (instead of
    # straight to main) to get a real, deployable :staging image tag to point a
    # staging host at before promoting the same commit to main. See README's
    # Deployment section for the promotion flow and packages/review-queue's advice
    # on a separate staging database.
    branches: [main, staging]
  pull_request:

jobs:
  # `pnpm audit` is currently non-functional — npm's audit endpoint was retired
  # (HTTP 410) and pnpm hasn't migrated to the replacement bulk-advisory endpoint,
  # so dependency vulnerability scanning wasn't actually happening anywhere. This
  # restores it via OSV (Google's open vulnerability database), which reads the
  # lockfile directly and doesn't depend on the broken npm endpoint. fail-on-vuln
  # makes this a real gate, not just a report nobody reads.
  dependency-scan:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8"
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml
      fail-on-vuln: true
      upload-sarif: true

  build-and-test:
    runs-on: ubuntu-latest
    # Backs postgres-store.test.ts (packages/review-queue) — the opt-in Postgres
    # backend for the review-queue store, used when DATABASE_URL is set (required
    # once the dashboard and orchestrator run on separate machines/processes; see
    # packages/review-queue/README.md). Without this service the suite would only
    # ever run against a developer's local Postgres and never in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vvugc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vvugc_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails fast, before the slower build/test/e2e steps — no point spending
      # those minutes if a lint error would fail the run anyway.
      - run: pnpm lint

      # Deliberately not `pnpm build` (turbo) — turbo's downloaded native binary
      # hit a sandbox exec restriction during development; `pnpm -r run build`
      # (plain per-package tsc) is what's actually been verified to work.
      - run: pnpm -r run build

      - run: pnpm -r run test

      # Playwright e2e — real-browser interaction tests for the two web apps
      # (filters/bulk-select/confirm-dialogs on the dashboard; nav toggle/video
      # play-pause/waitlist form on the marketing site). Not part of `pnpm -r run
      # test` since it needs a browser binary installed first.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/review-dashboard

      - run: pnpm test:e2e
        working-directory: apps/review-dashboard

      - run: pnpm test:e2e
        working-directory: apps/marketing-site

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/review-dashboard/playwright-report/
            apps/marketing-site/playwright-report/
          retention-days: 7

  # Publishes versioned, runnable Docker images on every push to main or staging —
  # the actual deployable artifacts, not just a green checkmark. Uses ghcr.io
  # (GitHub Container Registry) with the workflow's own GITHUB_TOKEN, which needs
  # no external account/secret setup — it works the moment this repo is pushed to
  # GitHub. This is the "publish the artifact" half of CD; the "run it somewhere"
  # half needs a hosting target (Fly.io/Railway/ECS/a VPS/etc) the user picks —
  # that choice isn't this workflow's to make, so it stops at a pull-able image.
  #
  # Every push also gets its own immutable `:<sha>` tag regardless of branch — that's
  # what .github/workflows/rollback.yml retags as `:latest`/`:staging` to roll back,
  # and what a staging deploy promotes to production once verified (same image, not
  # a rebuild — see README's Deployment section).
  build-and-push-images:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: review-dashboard
            dockerfile: Dockerfile.review-dashboard
          - image: marketing-site
            dockerfile: Dockerfile.marketing-site
          - image: orchestrator
            dockerfile: Dockerfile.orchestrator
    steps:
      - uses: actions/checkout@v4

      # ghcr.io requires a lowercase image path; github.repository preserves
      # whatever case the repo owner/name actually has.
      - name: Compute lowercase repository name
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # main's moving tag is :latest (the established convention); staging's is
      # :staging — so a staging deploy target and a production deploy target can
      # each point at a stable tag for their own channel without colliding.
      - name: Compute the moving tag for this branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "MOVING_TAG=staging" >> "$GITHUB_ENV"
          else
            echo "MOVING_TAG=latest" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:${{ env.MOVING_TAG }}
            ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
