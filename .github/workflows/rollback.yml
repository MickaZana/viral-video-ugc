name: Rollback deployed image

# Every push to main/staging (see ci.yml) tags its image with both a moving tag
# (:latest or :staging) and an immutable :<sha> — this workflow retags an already-
# pushed :<sha> as the moving tag, so a rollback is "point the moving tag at a
# commit that already built and passed CI" rather than a fresh build (which could
# itself fail, or silently produce different output than what was actually running
# before). Manual/on-demand only — this is a "break glass" action, not automation
# that runs on every push. See README's Deployment section for when to use this.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Which image to roll back"
        required: true
        type: choice
        options: [review-dashboard, marketing-site, orchestrator, all]
      sha:
        description: >-
          Commit SHA to roll back to. Must already have a pushed :<sha> image —
          check the Actions history for a successful "build-and-push-images" run
          against that commit before using it here.
        required: true
      channel:
        description: "Which moving tag to repoint (:latest = production, :staging = staging)"
        required: true
        type: choice
        options: [latest, staging]
        default: latest

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Compute lowercase repository name
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag :<sha> as the selected moving tag — no rebuild, same bytes that already passed CI
        run: |
          IMAGES="${{ inputs.image }}"
          if [ "$IMAGES" = "all" ]; then
            IMAGES="review-dashboard marketing-site orchestrator"
          fi
          for img in $IMAGES; do
            SRC="ghcr.io/${REPO_LC}/${img}:${{ inputs.sha }}"
            DEST="ghcr.io/${REPO_LC}/${img}:${{ inputs.channel }}"
            echo "Rolling back $DEST -> $SRC"
            docker buildx imagetools create --tag "$DEST" "$SRC"
          done
