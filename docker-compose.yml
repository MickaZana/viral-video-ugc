# Each service's Dockerfile drops root and runs as uid 1000 (the base image's built-in
# "node" user). The ./runs bind mount below keeps the host directory's own ownership,
# so if it's not already writable by uid 1000 on your host, run once:
#   chmod -R a+rwX runs
# or override each service with `user: "${UID}:${GID}"` to match your own account instead.
services:
  review-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.review-dashboard
    ports:
      - "4310:4310"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./runs:/repo/runs
    restart: unless-stopped

  marketing-site:
    build:
      context: .
      dockerfile: Dockerfile.marketing-site
    ports:
      - "4320:4320"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./runs:/repo/runs
    restart: unless-stopped

  # One-off pipeline run, not a long-running service — e.g.:
  #   docker compose run --rm orchestrator run --niche=fitness --platforms=tiktok,youtube_shorts
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    env_file:
      - path: .env
        required: false
    volumes:
      - ./runs:/repo/runs
    profiles:
      - cli

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.video-worker
    ports:
      - "4330:4330"
    env_file:
      - path: .env
        required: false
    environment:
      - VVUGC_LLM_LIVE=${VVUGC_LLM_LIVE:-false}
      - VIDEO_WORKER_CONCURRENCY=${VIDEO_WORKER_CONCURRENCY:-2}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-}
    volumes:
      - ./runs:/repo/runs
    depends_on:
      review-dashboard:
        condition: service_started
    restart: unless-stopped
