# fly.toml app configuration file generated for viral-video-ugc on 2026-07-23T10:19:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'viral-video-ugc'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.review-dashboard'

[env]
  NODE_ENV = 'production'
  PORT = '4310'
  TRUST_PROXY_HOPS = '1'
  VVUGC_RUNS_DIR = '/data/runs'

[[mounts]]
  source = 'vvugc_runs'
  destination = '/data'

[http_service]
  internal_port = 4310
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
